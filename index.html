<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Tracking Visualization</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="game.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <h2>Face Tracking Settings</h2>
      <div class="settings-group">
        <label for="lineColor">Line Color:</label>
        <input type="color" id="lineColor" value="#00ff00">
      </div>
      <div class="settings-group">
        <label for="lineWidth">Line Width:</label>
        <input type="range" id="lineWidth" min="0.5" max="5" step="0.5" value="2">
        <span id="lineWidthValue">2</span>
      </div>
      <div class="settings-group">
        <label for="glowIntensity">Glow Intensity:</label>
        <input type="range" id="glowIntensity" min="0" max="20" value="10">
        <span id="glowIntensityValue">10</span>
      </div>
      <div class="settings-group">
        <label for="backgroundPrompt">Background Image Prompt:</label>
        <input type="text" id="backgroundPrompt" placeholder="Enter image description">
      </div>
      <div class="settings-group">
        <label for="gameMode">Game Mode:</label>
        <input type="checkbox" id="gameMode">
        <span>Enable falling objects game</span>
      </div>
      <button id="startButton">Start Face Tracking</button>
    </div>
  </div>
  
  <div class="container" style="display: none">
    <div id="score">Score: 0</div>
    <canvas id="output"></canvas>
    <video id="input" style="display: none"></video>
    <canvas id="gameCanvas"></canvas>
  </div>

</body>
</html>
